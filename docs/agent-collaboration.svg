<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1300" viewBox="0 0 1920 1300" role="img" aria-labelledby="title desc">
<title id="title">Agent collaboration and game design — GameCrafter </title>
<desc id="desc">An executing agent coordinates specialist design roles through shared validated artifacts. Design, asset planning, art direction and world design guide image generation, Tripo, Blender and Unreal. Source and visual reviewers inspect current evidence and return structured issues for targeted repair. Executable gameplay, camera and data checks remain separate from model reviewers.</desc>
