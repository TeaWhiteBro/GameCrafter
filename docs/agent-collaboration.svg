<text x="205" y="1213" font-size="20" font-weight="500" fill="#b05235" >Cited failure → responsible agent / adapter → scoped revision → new evidence → re-review</text>
<text x="40" y="1250" font-size="17" font-weight="400" fill="#526875" >Role collaboration is mediated by run artifacts; the local stage executor is sequential. Review does not replace deterministic validation.</text>
<text x="40" y="1278" font-size="16" font-weight="400" fill="#526875" >World design includes conditional exploration refinement. Structural repairs use the executing agent; only bounded lighting patches are CLI-automatic.</text>
